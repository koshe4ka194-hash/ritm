<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Мостик заботы — нейроквест</title>
<style>
:root{color-scheme:light;--text:#594565;--pink:#edadd2;--violet:#ad8bda;--edge:rgba(255,255,255,.58)}
*{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0;background:transparent!important;color:var(--text);font-family:'Trebuchet MS',Verdana,sans-serif}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #3e83b7;outline-offset:3px}button:disabled{cursor:not-allowed;opacity:.55}
#root{min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;padding:clamp(6px,1.4vw,16px);background:transparent!important}
.game{width:min(100%,1060px);min-height:min(610px,97vh);border-radius:30px;border:1.5px solid rgba(255,255,255,.58);background:rgba(222,225,230,.54);-webkit-backdrop-filter:blur(15px) saturate(1.1);backdrop-filter:blur(15px) saturate(1.1);box-shadow:0 15px 42px rgba(45,39,57,.16),inset 0 1px rgba(255,255,255,.6);padding:clamp(12px,2.2vw,26px);display:flex;flex-direction:column;gap:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.brand{font-weight:900;font-size:clamp(20px,2.4vw,29px);color:#845792}.sub{font-size:12px;font-weight:bold;color:#815d8d}.pill{background:rgba(255,255,255,.75);border:1px solid #e0cbe5;padding:8px 13px;border-radius:24px;font-size:13px;font-weight:800}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.tab{min-height:48px;padding:8px 5px;border-radius:15px;border:1px solid #dac5e1;background:rgba(255,255,255,.7);color:#845d8c;font-size:clamp(12px,1.6vw,15px);font-weight:900}.tab.current{background:#f6d8ed;color:#633b72;border-color:#cd9dca}.tab.done{background:#def4e6;border-color:#97cba8}
.levels{display:flex;justify-content:center;gap:10px}.lvl{border:1px solid #d7b8de;border-radius:50px;background:rgba(255,255,255,.76);padding:8px 17px;color:#81538d;font-weight:900}.lvl.current{background:linear-gradient(120deg,#ed9bc7,#ae93e3);color:white}.lvl.done:not(.current){background:#daf3e4}
.stage{min-height:310px;flex:1;border:1px solid rgba(255,255,255,.6);background:rgba(249,249,251,.62);border-radius:25px;padding:clamp(12px,2.1vw,25px);text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:11px;overflow:hidden}
h1{margin:0;color:#784a83;font-size:clamp(24px,3.1vw,34px)}p{margin:0;line-height:1.48;font-size:clamp(14px,1.6vw,17px);max-width:740px}.muted{font-size:13px;color:#886f91}.note{padding:10px 14px;border-radius:17px;border:1px solid #e2d1e7;background:rgba(255,255,255,.73);font-weight:750}.rules{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:9px;width:100%}.rule{display:flex;align-items:center;gap:8px;border-radius:15px;padding:5px 12px;background:rgba(255,255,255,.75);border:1px solid #e0c5e3;font-weight:850;font-size:clamp(13px,1.5vw,16px)}.rule img{width:39px;height:39px;object-fit:contain}.rule.ban{border-color:#e99eaa;background:#ffecef}.actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.btn{border:0;border-radius:22px;background:linear-gradient(115deg,#e98abe,#ac83df);color:white;font-weight:900;padding:12px 21px;min-height:44px;box-shadow:0 4px 0 #9f76b8}.btn.secondary{color:#7b5688;background:#fff;border:1px solid #d8b9de;box-shadow:none}.btn:active{transform:translateY(2px)}.bigicon{width:clamp(122px,20vw,210px);height:clamp(122px,20vw,210px);object-fit:contain;filter:drop-shadow(0 5px 10px rgba(107,59,109,.13))}.sign{position:relative;display:inline-grid;place-items:center;padding:13px;min-width:180px;min-height:180px}.sign.prohibit{border:clamp(9px,1.4vw,15px) solid #e05260;border-radius:50%;background:rgba(255,236,237,.6)}.sign.prohibit:after{content:'';position:absolute;left:4%;right:4%;top:50%;height:clamp(9px,1.3vw,14px);background:#e05260;border-radius:14px;transform:rotate(-45deg);box-shadow:0 0 0 2px rgba(255,255,255,.55)}.sign.prohibit .bigicon{width:clamp(112px,17vw,180px);height:clamp(112px,17vw,180px)}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;width:min(100%,540px)}.answer{border:2px solid #d9c1e2;border-radius:15px;background:rgba(255,255,255,.89);padding:12px 8px;color:#744f7d;font-weight:900;min-height:52px}.answer.wrong{background:#ffeaec;border-color:#e98d9b}.answer.correct{background:#dcf5e3;border-color:#72bf94}.answer:disabled{opacity:1}.reaction{font-weight:900;font-size:clamp(16px,2vw,22px);min-height:25px}.reaction.ok{color:#3b986a}.reaction.no{color:#c05f71}.count{font-size:13px;font-weight:850;color:#92679d}.track{height:9px;width:min(100%,480px);border-radius:99px;background:#e0cde6;overflow:hidden}.track>div{height:100%;background:linear-gradient(90deg,#e597c7,#ab95e1);transition:width .2s}
.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 12px;border-radius:16px;background:rgba(255,255,255,.35);color:#82638b;font-size:12px;font-weight:800}.flowers{letter-spacing:2px}.flowers .earned{filter:none;opacity:1}.flowers span{filter:grayscale(1);opacity:.45}.banner{padding:13px 22px;background:#ffe8f3;border:2px solid #e3b4d7;border-radius:18px;font-size:clamp(20px,2.8vw,28px);font-weight:900;color:#ac5788}
@media(max-width:610px){#root{align-items:flex-start;padding:4px}.game{border-radius:18px;min-height:100dvh;padding:9px;gap:8px}.stage{padding:10px;min-height:285px}.rule{padding:3px 7px}.rule img{width:31px;height:31px}.answers{gap:6px}.answer{font-size:13px;min-height:45px}.bottom{justify-content:center}.pill{font-size:11px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

<nav class="tabs"><button class="tab" data-task="0">1. Выполняй команды</button><button class="tab" data-task="1">2. Новое правило</button><button class="tab" data-task="2">3. Запретный знак</button></nav>

const LABEL={heart:'Сердечко',flower:'Цветок',star:'Звёздочка'};
const ACTION={clap:'👏 Хлопни',stomp:'👣 Топни',hands:'🙌 Руки вверх',freeze:'🧍 Замри',none:'🚫 Не двигайся'};
const BASIC={heart:'clap',flower:'stomp',star:'hands'};
const SWITCH={heart:'stomp',flower:'clap',star:'freeze'};
const LENGTH=[8,12,16];
const stage=document.getElementById('stage'),tag=document.getElementById('tag'),status=document.getElementById('status'),flowers=document.getElementById('flowers');
let task=-1,level=0,round=[],index=0,rightCount=0,firstError=false,phase='home',switched=false;
const done=new Set();
function element(name,cls,txt){const e=document.createElement(name);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function pushTitle(title,desc){stage.append(element('h1','',title),element('p','',desc))}
function action(text,callback,secondary=false){const b=element('button','btn'+(secondary?' secondary':''),text);b.type='button';b.addEventListener('click',callback);return b}
function row(...elements){const box=element('div','actions');box.append(...elements);stage.append(box)}
function icon(name,size='ruleicon'){const img=element('img',size);img.src=ICON[name];img.alt=LABEL[name];return img}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function showRules(map,ban=false){const area=element('div','rules');for(const name of ['heart','flower','star']){if(level===0 && task===0 && name==='star')continue;const item=element('div','rule');item.append(icon(name),element('span','',ACTION[map[name]]));area.append(item)}if(ban)area.append(element('div','rule ban','🔴 Красный круг — НЕ двигайся'));stage.append(area)}
function update(){document.querySelectorAll('[data-task]').forEach(b=>{const n=+b.dataset.task;b.className='tab'+(n===task?' current':Array.from(done).filter(k=>k.startsWith(n+'-')).length===3?' done':'')});document.querySelectorAll('[data-level]').forEach(b=>{const n=+b.dataset.level;b.className='lvl'+(n===level&&task>=0?' current':task>=0&&done.has(task+'-'+n)?' done':'')});tag.textContent=task===-1?'Выберите игру':`Задание ${task+1} · уровень ${level+1}`;status.textContent=`Пройдено ${done.size} из 9 испытаний`;flowers.replaceChildren();for(let i=0;i<9;i++)flowers.append(element('span',done.has(Math.floor(i/3)+'-'+i%3)?'earned':'','🌸'))}
function home(){task=-1;phase='home';stage.replaceChildren();stage.append(element('div','banner','Волшебный мост ждёт тебя!'));pushTitle('Мостик заботы','Смотри на сигнал, выполняй движение и затем выбирай соответствующую команду на экране.');stage.append(element('p','note','Движения ребёнка наблюдает педагог. Игра автоматически проверяет выбор команды на экране.'));row(action('Выполняй команды',()=>choose(0,0)),action('Новое правило',()=>choose(1,0)),action('Запретный знак',()=>choose(2,0)));update()}
function choose(t,l){task=t;level=l;phase='ready';round=[];stage.replaceChildren();const titles=['Выполняй команды','Правила поменялись!','Запретный знак'];const desc=[
'Смотри на сердечко, цветок или звёздочку. Выполняй движение, которое подходит к сигналу.',
'В середине игры правила поменяются. Важно заметить переключение и запомнить новые команды.',
'Красный круг запрещает любое движение! Если его нет — действуй по обычному правилу.'
];pushTitle(titles[t],desc[t]);showRules(BASIC,t===2);stage.append(element('p','note',`Уровень ${l+1}: ${LENGTH[l]} сигналов. ${t===1?'Правила изменятся в середине серии.':t===2?'Часть сигналов появится в красном круге.':'Проверим внимание и удержание инструкции.'}`));row(action('Начать испытание',start),action('Выбрать другое',home,true));update()}
function buildRound(){const available=task===0&&level===0?['heart','flower']:['heart','flower','star'];const n=LENGTH[level];let arr=[];for(let i=0;i<n;i++){
let options=available.filter(x=>!(i>1&&arr[i-1].name===x&&arr[i-2].name===x));if(task===2&&level===0)options=options.filter(x=>x!=='star');
const name=options[Math.floor(Math.random()*options.length)];const banned=task===2 && (level===0 ? i%3===1 : level===1 ? i%3!==0 : ((i*7+3)%5<2));arr.push({name,banned});
}if(task===2&&!arr.some(x=>x.banned))arr[1].banned=true;return arr}
function start(){round=buildRound();index=0;rightCount=0;firstError=false;switched=false;phase='signal';showSignal()}
function switchedNow(){return task===1&&index>=Math.floor(round.length/2)}
function currentMap(){return switchedNow()?SWITCH:BASIC}
function switchScreen(){phase='switch';stage.replaceChildren();stage.append(element('div','banner','✨ НОВОЕ ПРАВИЛО! ✨'));pushTitle('Команды поменялись','Сердечко и цветок поменялись движениями, а на звёздочку теперь нужно замирать.');showRules(SWITCH);row(action('Я запомнил! Продолжить',()=>{switched=true;showSignal()}))}
function showSignal(){if(index>=round.length)return result();if(switchedNow()&&!switched)return switchScreen();phase='signal';firstError=false;stage.replaceChildren();const trial=round[index],map=currentMap();stage.append(element('div','count',`Сигнал ${index+1} из ${round.length}`));const track=element('div','track');const fill=element('div');fill.style.width=(index/round.length*100)+'%';track.append(fill);stage.append(track);
const sign=element('div','sign'+(trial.banned?' prohibit':''));sign.append(icon(trial.name,'bigicon'));stage.append(sign);
stage.append(element('p','',task===2?'Выполни движение, если знак не запрещён. Что нужно было сделать?':'Выполни движение. Затем выбери правильную команду:'));
const answers=element('div','answers');const vals=task===2?['clap','stomp','hands','none']:task===1?['clap','stomp','hands','freeze']:['clap','stomp','hands','freeze'];vals.forEach(v=>{const b=element('button','answer',ACTION[v]);b.type='button';b.addEventListener('click',()=>check(v,b,answers));answers.append(b)});stage.append(answers);stage.append(element('div','reaction',''));
if(task===2){stage.append(element('p','muted','Красный круг = запрет движения. Без круга выполняй соответствующую команду.'))}
}
function check(answer,btn,answers){if(phase!=='signal')return;const trial=round[index];const expected=trial.banned?'none':currentMap()[trial.name];let message=stage.querySelector('.reaction');if(answer===expected){phase='answered';btn.classList.add('correct');if(!firstError)rightCount++;message.textContent='Верно! ✨';message.className='reaction ok';answers.querySelectorAll('button').forEach(b=>b.disabled=true);row(action(index===round.length-1?'Завершить испытание 🌸':'Следующий сигнал →',()=>{index++;showSignal()}))}else{firstError=true;btn.classList.add('wrong');btn.disabled=true;message.textContent='Попробуй ещё раз: вспомни правило!';message.className='reaction no'}}
function result(){phase='result';done.add(task+'-'+level);stage.replaceChildren();stage.append(element('div','banner','🌷 Лепесток заботы! 🌷'));pushTitle('Мостик пройден!',`Правильных ответов с первой попытки: ${rightCount} из ${round.length}.`);stage.append(element('p','note','Педагог может отдельно оценить точность и своевременность реальных движений ребёнка.'));row(action('Следующий уровень',()=>choose(task,(level+1)%3)),action('Выбор заданий',home,true),action('Повторить эту серию',()=>choose(task,level),true));update()}
document.querySelectorAll('[data-task]').forEach(b=>b.addEventListener('click',()=>choose(+b.dataset.task,0)));
document.querySelectorAll('[data-level]').forEach(b=>b.addEventListener('click',()=>choose(task<0?0:task,+b.dataset.level)));
document.getElementById('home').addEventListener('click',home);
home();
})();
